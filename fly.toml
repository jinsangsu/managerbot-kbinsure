app = "managerbot-kbinsure"

kill_signal = "SIGINT"
kill_timeout = 5
processes = []

[build]
  dockerfile = "./Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[experimental]
  auto_rollback = true

[deploy]
  strategy = "rolling"

[services]
  [[services.ports]]
    handlers = ["http"]
    port = 80
  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

[metrics]
  port = 8080
  path = "/metrics"

[regions]
  region = "nrt"